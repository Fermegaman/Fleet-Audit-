<script>
const seed=JSON.parse(document.getElementById('seed').textContent);
const KEY='FleetAuditHub_v3';
let saved;
try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){saved=null}
const state=saved||{
 clients:[{shortCode:'AGPL',company:'Angell Parcel & Logistics, LLC',station:'DDA9',status:'Active'}],
 actions:[], elementAudits:[], leaseAudits:[],
 sheets:seed
};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function setTitle(t,s){$('title').textContent=t;$('subtitle').textContent=s}
function data(name){return state.sheets[name]||[]}
function rows(name){return data(name).slice(1)}
function tbl(a,limit=500){
 if(!a||!a.length)return '<div class="empty">No records yet.</div>';
 const h=a[0]||[], d=a.slice(1,limit+1);
 return '<div class="table"><table><thead><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
 d.map(r=>'<tr>'+h.map((_,i)=>'<td>'+esc(r&&r[i])+'</td>').join('')+'</tr>').join('')+
 '</tbody></table></div>';
}
function cards(){
 const fleet=Math.max(0,rows('Branded Fleet').length), ground=Math.max(0,rows('Van Info').length),
 rentals=Math.max(0,rows('Rental Tracker').length), actions=state.actions.length;
 return '<div class="cards">'+
 '<div class="card"><div class="muted">Fleet records</div><div class="num">'+fleet+'</div></div>'+
 '<div class="card"><div class="muted">Grounded records</div><div class="num">'+ground+'</div></div>'+
 '<div class="card"><div class="muted">Rental records</div><div class="num">'+rentals+'</div></div>'+
 '<div class="card"><div class="muted">Open actions</div><div class="num">'+actions+'</div></div></div>';
}
function dashboard(){
 setTitle('Dashboard','Your AGPL workbook, organized into one application.');
 $('content').innerHTML=cards()+
 '<div class="grid"><div class="panel"><h3>Start here</h3><div class="toolbar">'+
 '<button class="btn" onclick="go(\'fleet\')">Upload / update fleet</button>'+
 '<button class="btn" onclick="go(\'element\')">Element audit</button>'+
 '<button class="btn" onclick="go(\'leaseplan\')">LeasePlan audit</button>'+
 '<button class="btn secondary" onclick="go(\'clients\')">Manage clients</button></div>'+
 '<div class="notice"><b>How to use it:</b> Select a module on the left. You can add records with the blue “Add” buttons. Information is saved in this browser for this prototype.</div></div>'+
 '<div class="panel"><h3>Audit cadence</h3><p class="muted">Element: invoice ready by the 1st and client review by the 15th. LeasePlan: complete the invoice summary, VIN-level tables and completion status.</p></div></div>'+
 '<div class="panel" style="margin-top:14px"><h3>Current fleet</h3>'+tbl(data('Branded Fleet'),20)+'</div>';
}
function clients(){
 setTitle('Clients','One client registry instead of one workbook per client.');
 $('content').innerHTML='<div class="panel"><div class="toolbar"><button class="btn" onclick="addClient()">+ Add client</button></div>'+
 '<div class="table"><table><thead><tr><th>Short Code</th><th>Company</th><th>Station</th><th>Status</th></tr></thead><tbody>'+
 state.clients.map((c,i)=>'<tr><td>'+esc(c.shortCode)+'</td><td>'+esc(c.company)+'</td><td>'+esc(c.station)+'</td><td>'+esc(c.status)+'</td></tr>').join('')+
 '</tbody></table></div></div>';
}
function addClient(){
 const short=prompt('Client short code (example: AGPL):'); if(!short)return;
 const company=prompt('Company name:')||short;
 const station=prompt('Station code:')||'';
 state.clients.push({shortCode:short.toUpperCase(),company,station,status:'Active'}); save(); clients();
}
function fleet(){
 setTitle('Fleet & Grounded','Upload a fresh fleet export or add/update a grounded record.');
 $('content').innerHTML='<div class="grid2"><div class="panel"><h3>Import</h3><div class="drop">Choose a CSV fleet export<br><input id="fleetFile" type="file" accept=".csv"></div>'+
 '<div class="notice">For this version, CSV import is supported directly in the browser. If your Amazon download is XLSX, save/export that sheet as CSV first. The production version should accept XLSX directly.</div></div>'+
 '<div class="panel"><h3>Add grounded vehicle</h3>'+form([
 ['van','Van #'],['vin','VIN'],['date','Date Grounded'],['issue','Repair / Issue'],['location','Location'],['status','Repair Status'],['notes','Notes']
 ],'addGrounded')+'</div></div>'+
 '<div class="panel" style="margin-top:14px"><h3>Branded Fleet</h3>'+tbl(data('Branded Fleet'),300)+'</div>'+
 '<div class="panel" style="margin-top:14px"><h3>Grounded Vans</h3>'+tbl(data('Van Info'),300)+'</div>';
 $('fleetFile').addEventListener('change',e=>importCSV(e.target.files[0],'Branded Fleet'));
}
function form(fields,fn){
 return '<div class="formgrid">'+fields.map(f=>'<div class="field"><label>'+esc(f[1])+'</label><input id="f_'+esc(f[0])+'"></div>').join('')+
 '<div class="field full"><button class="btn" onclick="'+fn+'()">Save</button></div></div>';
}
function addGrounded(){
 const vals=['van','vin','date','issue','location','status','notes'].map(k=>$('f_'+k).value);
 const a=data('Van Info'); if(!a.length)return;
 a.push([vals[0],vals[1],vals[2],vals[3],'',vals[4],'',vals[5],vals[6],'','']); save(); fleet();
}
function importCSV(file,sheetName){
 if(!file)return;
 const r=new FileReader();r.onload=()=>{const text=r.result.replace(/\\r/g,'');const lines=text.split('\\n').filter(x=>x.trim());const parsed=lines.map(line=>{let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='\"'){if(q&&line[i+1]==='\"'){cur+='\"';i++}else q=!q}else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out});state.sheets[sheetName]=parsed;save();fleet();};r.readAsText(file);
}
function rentals(){setTitle('Rentals','Centralized rental tracker.');$('content').innerHTML='<div class="panel"><div class="toolbar"><button class="btn" onclick="alert(\'Rental entry form is ready for the database build.\')">+ Add rental</button></div>'+tbl(data('Rental Tracker'))+'</div>'}
function maintenance(){setTitle('PM / Maintenance','Preventative maintenance and repair tracking.');$('content').innerHTML='<div class="panel"><div class="toolbar"><button class="btn" onclick="alert(\'PM entry form is ready for the database build.\')">+ Add PM item</button></div>'+tbl(data('PMS'))+'</div>'}
function fif(){setTitle('FIF','Fleet Improvement Fund tracking.');$('content').innerHTML='<div class="panel"><div class="toolbar"><button class="btn" onclick="alert(\'FIF entry form is ready for the database build.\')">+ Add claim</button></div>'+tbl(data('FIF Tracker'))+'</div>'}
function tolls(){setTitle('Toll Claims','Expected, approved and resolved toll reimbursement.');$('content').innerHTML='<div class="panel"><div class="toolbar"><button class="btn" onclick="alert(\'Toll entry form is ready for the database build.\')">+ Add claim</button></div>'+tbl(data('Toll Tracker'))+'</div>'}
function pave(){setTitle('PAVE','Inspection due-date tracking.');$('content').innerHTML='<div class="panel">'+tbl(data('Pave'))+'</div>'}
function recalls(){setTitle('Recalls','Recall status.');$('content').innerHTML='<div class="panel">'+tbl(data('Recalls'))+'</div>'}
function actions(){
 setTitle('Open Actions','A single place for disputes, missing documents and follow-ups.');
 $('content').innerHTML='<div class="panel"><div class="toolbar"><button class="btn" onclick="addAction()">+ Add action</button></div>'+
 (state.actions.length?'<div class="table"><table><thead><tr><th>Client</th><th>Area</th><th>Action</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>'+
 state.actions.map((a,i)=>'<tr><td>'+esc(a.client)+'</td><td>'+esc(a.area)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.owner)+'</td><td>'+esc(a.due)+'</td><td>'+esc(a.status)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No open actions.</div>')+'</div>';
}
function addAction(){
 const action=prompt('What needs to be done?');if(!action)return;
 const area=prompt('Area (Element, LeasePlan, Grounded, Rental, etc.):')||'';
 const owner=prompt('Owner:')||'';const due=prompt('Due date:')||'';
 state.actions.push({client:'AGPL',area,action,owner,due,status:'Open'});save();actions();
}
function invoices(){setTitle('Invoice Audits','Two workflows based directly on the provided SOPs.');$('content').innerHTML='<div class="grid2"><div class="panel"><h3>Element Invoice</h3><p class="muted">PDF + CDV + fleet matching workflow.</p><button class="btn" onclick="go(\'element\')">Open Element Audit</button></div><div class="panel"><h3>LeasePlan / Wheels</h3><p class="muted">PDF summary and VIN-level review workflow.</p><button class="btn" onclick="go(\'leaseplan\')">Open LeasePlan Audit</button></div></div>'}
function check(items){return '<div class="check">'+items.map(x=>'<label><input type="checkbox"> '+x+'</label>').join('')+'</div>'}
function element(){
 setTitle('Element Invoice Audit','Upload the source files, then work through the SOP checklist.');
 $('content').innerHTML='<div class="grid2"><div class="panel"><h3>1. Source files</h3><div class="drop">Element PDF<br><input type="file" accept=".pdf"></div><br><div class="drop">Element CDV / CSV<br><input type="file" accept=".csv,.txt,.cdv"></div><div class="notice">The production build will read these files automatically. For now this screen is the workflow/checklist.</div></div><div class="panel"><h3>2. Audit checklist</h3>'+
 check(['Invoice ready by the 1st','Fleet export uploaded','Element invoice data processed','VIN matched to fleet','Amazon Lease / Amazon owned identified','Charges summarized','VIN-level review completed','Client review sent by the 15th','Maintenance charges sent to Element and marked pending'])+'</div></div>'+
 '<div class="panel" style="margin-top:14px"><h3>3. Audit record</h3>'+form([['month','Invoice Month'],['total','Invoice Total'],['status','Status'],['notes','Notes']],'saveElement')+'</div>';
}
function saveElement(){const o={client:'AGPL',month:$('f_month').value,total:$('f_total').value,status:$('f_status').value,notes:$('f_notes').value};state.elementAudits.push(o);save();alert('Element audit saved.');go('dashboard')}
function leaseplan(){
 setTitle('LeasePlan / Wheels Audit','PDF summary → verification → completion.');
 $('content').innerHTML='<div class="panel"><h3>1. Invoice PDF</h3><div class="drop">Choose LeasePlan PDF<br><input type="file" accept=".pdf"></div><div class="notice">The production version will extract the five categories from the PDF. For now, enter/verify the amounts below.</div></div>'+
 '<div class="grid2" style="margin-top:14px"><div class="panel"><h3>2. Charge Summary</h3>'+form([['month','Invoice Month'],['lease','Lease Charges'],['maintenance','Maintenance Charges'],['tolls','Tolls'],['misc','Misc Charges'],['credit','Credits'],['total','PDF Total']],'saveLease')+'</div>'+
 '<div class="panel"><h3>3. SOP Checklist</h3>'+check(['Invoice exported / saved','Summary includes Lease, Maintenance, Tolls, Misc and Credit','Summary total matches PDF','Maintenance VINs / descriptions / costs reviewed','Toll VINs / amounts reviewed','Credits and Misc communicated','Lease charge count checked','Audit marked complete and client email sent'])+'</div></div>';
}
function saveLease(){let o={client:'AGPL'};['month','lease','maintenance','tolls','misc','credit','total'].forEach(k=>o[k]=$('f_'+k).value);state.leaseAudits.push(o);save();alert('LeasePlan audit saved.');go('dashboard')}
function legacy(){
 setTitle('Original Data','The original workbook data is preserved here while the new modules are being built.');
 const names=Object.keys(seed);$('content').innerHTML='<div class="tabs">'+names.map((n,i)=>'<button data-i="'+i+'">'+esc(n)+'</button>').join('')+'</div><div id="legacyPanel"></div>';
 document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('legacyPanel').innerHTML=tbl(seed[names[+b.dataset.i]])}));
 document.querySelector('.tabs button').click();
}
const views={dashboard,clients,fleet,rentals,maintenance,invoices,fif,tolls,pave,recalls,element,leaseplan,actions,legacy};
function go(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));views[v]()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
go('dashboard');
</script>
